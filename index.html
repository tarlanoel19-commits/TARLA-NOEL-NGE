<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Task App</title>
  <style>
    /*
      Simple Task App
      - Pure HTML, CSS, and JavaScript
      - No database, no login, no external APIs
      - Tasks and theme are saved in localStorage
    */

    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --bg-accent: #dbeafe;
      --card: #ffffff;
      --card-soft: #f1f5f9;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ef;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #ef4444;
      --danger-dark: #dc2626;
      --shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      --low: #22c55e;
      --medium: #f59e0b;
      --high: #ef4444;
    }

    body.dark {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-accent: #1e3a8a;
      --card: #182235;
      --card-soft: #223049;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #334155;
      --primary: #60a5fa;
      --primary-dark: #3b82f6;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--bg-accent) 75%, transparent), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app {
      width: min(1060px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0;
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 4.75rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
    }

    .subtitle {
      max-width: 44rem;
      margin: 0.85rem 0 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .top-actions,
    .form-actions,
    .task-actions,
    .filters {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .top-actions {
      justify-content: flex-end;
    }

    .button,
    .filter-button,
    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.6rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .button {
      padding: 0.7rem 1rem;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      white-space: nowrap;
    }

    .button:hover,
    .filter-button:hover,
    .icon-button:hover {
      transform: translateY(-1px);
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .button.primary:hover {
      background: var(--primary-dark);
    }

    .button.ghost {
      box-shadow: none;
      background: transparent;
      color: var(--muted);
    }

    .button.ghost:hover {
      background: var(--card-soft);
      color: var(--text);
    }

    .button.danger {
      border-color: color-mix(in srgb, var(--danger) 40%, var(--border));
      color: var(--danger);
      box-shadow: none;
      background: transparent;
    }

    .button.danger:hover {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      background: color-mix(in srgb, var(--card) 94%, transparent);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .task-form {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 11rem 11rem;
      gap: 0.85rem;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .field.full {
      grid-column: span 2;
    }

    label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 1rem;
      outline: none;
      background: var(--card-soft);
      color: var(--text);
      padding: 0.85rem 0.95rem;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    textarea {
      min-height: 3.2rem;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent);
      background: var(--card);
    }

    .form-actions {
      grid-column: 1 / -1;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.15rem;
    }

    .form-note {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--card-soft) 38%, transparent);
    }

    .filter-button {
      min-height: 2.35rem;
      padding: 0.5rem 0.85rem;
      background: transparent;
      color: var(--muted);
    }

    .filter-button.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .sort-wrap select {
      width: auto;
      min-width: 10rem;
      padding: 0.55rem 2rem 0.55rem 0.75rem;
      border-radius: 999px;
    }

    .task-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-card {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.9rem;
      align-items: start;
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }

    .task-card:last-child {
      border-bottom: 0;
    }

    .task-card.completed {
      background: color-mix(in srgb, var(--card) 70%, var(--card-soft));
    }

    .task-card.completed .task-title,
    .task-card.completed .task-description {
      opacity: 0.58;
      text-decoration: line-through;
    }

    .task-check {
      width: 1.25rem;
      height: 1.25rem;
      margin-top: 0.25rem;
      accent-color: var(--primary);
    }

    .task-content {
      min-width: 0;
    }

    .task-title-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .task-title {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 1.05rem;
      line-height: 1.35;
    }

    .task-description {
      margin: 0.4rem 0 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .meta-row {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-top: 0.7rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: color-mix(in srgb, var(--card-soft) 75%, transparent);
      padding: 0.28rem 0.55rem;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .priority-badge.low {
      border-color: color-mix(in srgb, var(--low) 40%, var(--border));
      color: var(--low);
    }

    .priority-badge.medium {
      border-color: color-mix(in srgb, var(--medium) 45%, var(--border));
      color: var(--medium);
    }

    .priority-badge.high {
      border-color: color-mix(in srgb, var(--high) 45%, var(--border));
      color: var(--high);
    }

    .dot {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      background: currentColor;
    }

    .icon-button {
      width: 2.35rem;
      height: 2.35rem;
      padding: 0;
      background: transparent;
      color: var(--muted);
      box-shadow: none;
    }

    .icon-button:hover {
      background: var(--card-soft);
      color: var(--text);
    }

    .icon-button.delete:hover {
      border-color: var(--danger);
      background: var(--danger);
      color: #ffffff;
    }

    .task-actions {
      justify-content: flex-end;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.8rem 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.93rem;
      font-weight: 800;
      background: color-mix(in srgb, var(--card-soft) 38%, transparent);
    }

    .empty-state {
      padding: 3.5rem 1rem;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--text);
      font-size: 1.15rem;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 840px) {
      .task-form {
        grid-template-columns: 1fr 1fr;
      }

      .field.full {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 680px) {
      .app {
        width: min(100% - 1rem, 1060px);
        padding: 1rem 0;
      }

      .hero,
      .toolbar,
      .form-actions,
      .status-line {
        flex-direction: column;
        align-items: stretch;
      }

      .top-actions,
      .form-actions,
      .filters,
      .task-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .button,
      .filter-button {
        width: 100%;
      }

      .task-form {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .sort-wrap {
        align-items: stretch;
        flex-direction: column;
      }

      .sort-wrap select {
        width: 100%;
      }

      .task-card {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .task-actions {
        grid-column: 1 / -1;
        grid-template-columns: 1fr 1fr;
      }

      .icon-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Zero-login productivity</p>
        <h1>Simple Task App</h1>
        <p class="subtitle">Add, organize, edit, complete, filter, and sort tasks instantly. Everything stays saved in this browser.</p>
      </div>
      <div class="top-actions">
        <button class="button" id="themeToggle" type="button" aria-pressed="false">🌙 Dark</button>
        <button class="button" id="clearAllButton" type="button">🧹 Clear all</button>
      </div>
    </header>

    <section class="panel" aria-label="Task app">
      <!-- Input bar: this same form adds new tasks and saves edits. -->
      <form class="task-form" id="taskForm">
        <div class="field">
          <label for="titleInput">Task title *</label>
          <input id="titleInput" type="text" placeholder="e.g. Finish portfolio update" autocomplete="off" required />
        </div>

        <div class="field full">
          <label for="descriptionInput">Description optional</label>
          <textarea id="descriptionInput" placeholder="Add quick details, notes, or context"></textarea>
        </div>

        <div class="field">
          <label for="dueDateInput">Due date</label>
          <input id="dueDateInput" type="date" />
        </div>

        <div class="field">
          <label for="priorityInput">Priority</label>
          <select id="priorityInput">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>

        <div class="form-actions">
          <span class="form-note" id="formNote">Create a task, then use filters and sorting below.</span>
          <div class="form-actions">
            <button class="button ghost hidden" id="cancelEditButton" type="button">Cancel edit</button>
            <button class="button primary" id="submitButton" type="submit">Add task</button>
          </div>
        </div>
      </form>

      <!-- Controls: filter by status and sort the visible tasks. -->
      <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="active">Active</button>
          <button class="filter-button" type="button" data-filter="completed">Completed</button>
        </div>

        <label class="sort-wrap" for="sortInput">
          Sort
          <select id="sortInput">
            <option value="date">By date</option>
            <option value="priority">By priority</option>
            <option value="name">By name</option>
          </select>
        </label>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <div class="empty-state" id="emptyState" hidden>
        <strong>No tasks to show.</strong>
        Add a task or switch filters to find what you need.
      </div>

      <div class="status-line">
        <span id="taskCount">0 tasks</span>
        <button class="button danger" id="clearCompletedButton" type="button">Clear completed</button>
      </div>
    </section>
  </main>

  <script>
    // ----- Storage keys -----
    const TASKS_KEY = "simple-task-app.tasks";
    const THEME_KEY = "simple-task-app.theme";

    // ----- DOM elements -----
    const taskForm = document.querySelector("#taskForm");
    const titleInput = document.querySelector("#titleInput");
    const descriptionInput = document.querySelector("#descriptionInput");
    const dueDateInput = document.querySelector("#dueDateInput");
    const priorityInput = document.querySelector("#priorityInput");
    const submitButton = document.querySelector("#submitButton");
    const cancelEditButton = document.querySelector("#cancelEditButton");
    const formNote = document.querySelector("#formNote");
    const taskList = document.querySelector("#taskList");
    const emptyState = document.querySelector("#emptyState");
    const taskCount = document.querySelector("#taskCount");
    const clearCompletedButton = document.querySelector("#clearCompletedButton");
    const clearAllButton = document.querySelector("#clearAllButton");
    const sortInput = document.querySelector("#sortInput");
    const filterButtons = document.querySelectorAll("[data-filter]");
    const themeToggle = document.querySelector("#themeToggle");

    // ----- App state -----
    let tasks = loadTasks();
    let currentFilter = "all";
    let editingTaskId = null;

    // Start the app.
    applySavedTheme();
    renderTasks();

    // Add a new task or save an edited task.
    taskForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const title = titleInput.value.trim();
      if (!title) return;

      const taskData = {
        title,
        description: descriptionInput.value.trim(),
        dueDate: dueDateInput.value,
        priority: priorityInput.value
      };

      if (editingTaskId) {
        tasks = tasks.map(function (task) {
          return task.id === editingTaskId
            ? { ...task, ...taskData, updatedAt: Date.now() }
            : task;
        });
        stopEditing();
      } else {
        tasks.push({
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          ...taskData,
          completed: false,
          createdAt: Date.now(),
          updatedAt: Date.now()
        });
        taskForm.reset();
        priorityInput.value = "medium";
      }

      saveTasks();
      renderTasks();
      titleInput.focus();
    });

    // Handle complete, edit, and delete actions from inside the task list.
    taskList.addEventListener("click", function (event) {
      const taskCard = event.target.closest("[data-task-id]");
      if (!taskCard) return;

      const taskId = taskCard.dataset.taskId;

      if (event.target.matches("[data-action='toggle']")) {
        tasks = tasks.map(function (task) {
          return task.id === taskId ? { ...task, completed: event.target.checked } : task;
        });
      }

      if (event.target.closest("[data-action='edit']")) {
        startEditing(taskId);
        return;
      }

      if (event.target.closest("[data-action='delete']")) {
        tasks = tasks.filter(function (task) {
          return task.id !== taskId;
        });
        if (editingTaskId === taskId) stopEditing();
      }

      saveTasks();
      renderTasks();
    });

    // Switch between All, Active, and Completed views.
    filterButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(function (filterButton) {
          filterButton.classList.toggle("active", filterButton === button);
        });

        renderTasks();
      });
    });

    // Sort tasks when the dropdown changes.
    sortInput.addEventListener("change", renderTasks);

    // Clear only completed tasks.
    clearCompletedButton.addEventListener("click", function () {
      tasks = tasks.filter(function (task) {
        return !task.completed;
      });
      stopEditing();
      saveTasks();
      renderTasks();
    });

    // Clear every task after a quick confirmation.
    clearAllButton.addEventListener("click", function () {
      if (!tasks.length) return;
      if (!confirm("Delete all tasks?")) return;

      tasks = [];
      stopEditing();
      saveTasks();
      renderTasks();
    });

    // Light/dark mode toggle.
    themeToggle.addEventListener("click", function () {
      const useDark = !document.body.classList.contains("dark");
      document.body.classList.toggle("dark", useDark);
      localStorage.setItem(THEME_KEY, useDark ? "dark" : "light");
      updateThemeButton(useDark);
    });

    // Render visible tasks on the page.
    function renderTasks() {
      const visibleTasks = getVisibleTasks();

      taskList.innerHTML = visibleTasks.map(createTaskHtml).join("");
      emptyState.hidden = visibleTasks.length > 0;

      const activeCount = tasks.filter(function (task) { return !task.completed; }).length;
      const completedCount = tasks.length - activeCount;
      taskCount.textContent = `${tasks.length} total • ${activeCount} active • ${completedCount} completed`;
      clearCompletedButton.disabled = completedCount === 0;
      clearAllButton.disabled = tasks.length === 0;
    }

    // Apply current filter and sort order.
    function getVisibleTasks() {
      const priorityRank = { high: 3, medium: 2, low: 1 };

      return tasks
        .filter(function (task) {
          if (currentFilter === "active") return !task.completed;
          if (currentFilter === "completed") return task.completed;
          return true;
        })
        .sort(function (a, b) {
          if (sortInput.value === "name") {
            return a.title.localeCompare(b.title);
          }

          if (sortInput.value === "priority") {
            return priorityRank[b.priority] - priorityRank[a.priority] || a.title.localeCompare(b.title);
          }

          // Date sort: dated tasks first, earliest date first, then newest created.
          const aDate = a.dueDate ? new Date(a.dueDate).getTime() : Infinity;
          const bDate = b.dueDate ? new Date(b.dueDate).getTime() : Infinity;
          return aDate - bDate || b.createdAt - a.createdAt;
        });
    }

    // Convert a task object into safe HTML.
    function createTaskHtml(task) {
      const priorityLabel = task.priority.charAt(0).toUpperCase() + task.priority.slice(1);
      const dueDateLabel = task.dueDate ? formatDate(task.dueDate) : "No due date";
      const description = task.description
        ? `<p class="task-description">${escapeHtml(task.description)}</p>`
        : "";

      return `
        <li class="task-card ${task.completed ? "completed" : ""}" data-task-id="${task.id}">
          <input
            class="task-check"
            data-action="toggle"
            type="checkbox"
            aria-label="Mark ${escapeHtml(task.title)} ${task.completed ? "incomplete" : "complete"}"
            ${task.completed ? "checked" : ""}
          />

          <div class="task-content">
            <div class="task-title-row">
              <h2 class="task-title">${escapeHtml(task.title)}</h2>
              <span class="badge priority-badge ${task.priority}"><span class="dot"></span>${priorityLabel}</span>
            </div>
            ${description}
            <div class="meta-row">
              <span class="badge">📅 ${dueDateLabel}</span>
              <span class="badge">${task.completed ? "✅ Completed" : "⏳ Active"}</span>
            </div>
          </div>

          <div class="task-actions" aria-label="Task actions">
            <button class="icon-button" data-action="edit" type="button" aria-label="Edit ${escapeHtml(task.title)}">✏️</button>
            <button class="icon-button delete" data-action="delete" type="button" aria-label="Delete ${escapeHtml(task.title)}">🗑️</button>
          </div>
        </li>
      `;
    }

    // Load tasks from localStorage. If nothing is saved, start with an empty list.
    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(TASKS_KEY)) || [];
      } catch (error) {
        console.warn("Could not load saved tasks:", error);
        return [];
      }
    }

    // Save the latest task list to localStorage.
    function saveTasks() {
      localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
    }

    // Put an existing task into the form so it can be edited.
    function startEditing(taskId) {
      const task = tasks.find(function (item) {
        return item.id === taskId;
      });
      if (!task) return;

      editingTaskId = task.id;
      titleInput.value = task.title;
      descriptionInput.value = task.description;
      dueDateInput.value = task.dueDate;
      priorityInput.value = task.priority;

      submitButton.textContent = "Save changes";
      cancelEditButton.classList.remove("hidden");
      formNote.textContent = "Editing a task. Save changes or cancel edit.";
      titleInput.focus();
      taskForm.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Return the form to normal add-task mode.
    function stopEditing() {
      editingTaskId = null;
      taskForm.reset();
      priorityInput.value = "medium";
      submitButton.textContent = "Add task";
      cancelEditButton.classList.add("hidden");
      formNote.textContent = "Create a task, then use filters and sorting below.";
    }

    cancelEditButton.addEventListener("click", stopEditing);

    // Read saved theme, or use the system preference on first visit.
    function applySavedTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const useDark = savedTheme ? savedTheme === "dark" : prefersDark;
      document.body.classList.toggle("dark", useDark);
      updateThemeButton(useDark);
      priorityInput.value = "medium";
    }

    function updateThemeButton(useDark) {
      themeToggle.setAttribute("aria-pressed", String(useDark));
      themeToggle.textContent = useDark ? "☀️ Light" : "🌙 Dark";
    }

    function formatDate(dateString) {
      const date = new Date(dateString + "T00:00:00");
      return date.toLocaleDateString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    // Escape user text before inserting it as HTML.
    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
